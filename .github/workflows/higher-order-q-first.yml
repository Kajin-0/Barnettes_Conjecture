name: Higher-order Barnette Q-first search

on:
  workflow_dispatch:
  push:
    branches:
      - agent/adversarial-search-v2
    paths:
      - .github/workflows/higher-order-q-first.yml
      - search/higher_order_q_first.py
      - search/sat_verify_q_candidates.py
      - search/canonical_prepare.py
      - search/cyclic_cut_patch_search.py
      - source/**
      - requirements.txt
      - docs/runs/2026-08-01-higher-order-q-first.md
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/higher-order-q-first.yml
      - search/higher_order_q_first.py
      - search/sat_verify_q_candidates.py
      - search/canonical_prepare.py
      - search/cyclic_cut_patch_search.py
      - source/**
      - requirements.txt
      - docs/runs/2026-08-01-higher-order-q-first.md

permissions:
  contents: read

jobs:
  q-first:
    name: Q-first order ${{ matrix.order }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        order: [94, 96, 98, 100]
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      ORDER: ${{ matrix.order }}
      PLANTRI_SHA256: e78a944116fec9f2c9f5e484206276cc2b0043bae803e9815f4b2683614629b8
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python - <<'PY'
          import networkx, numpy, scipy, pysat
          print('networkx', networkx.__version__)
          print('numpy', numpy.__version__)
          print('scipy', scipy.__version__)
          print('python-sat', pysat.__version__)
          PY

      - name: Reconstruct exact-search sources
        run: python source/unpack_sources.py

      - name: Download and compile official plantri 5.8
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://users.cecs.anu.edu.au/~bdm/plantri/plantri58.tar.gz \
            --output plantri58.tar.gz
          echo "${PLANTRI_SHA256}  plantri58.tar.gz" | sha256sum --check
          tar xzf plantri58.tar.gz
          make -C plantri58 plantri
          ./plantri58/plantri 2>&1 | head -n 2 || true

      - name: Build independent DRAT proof checker
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/marijnheule/drat-trim.git tools/drat-trim
          make -C tools/drat-trim
          test -x tools/drat-trim/drat-trim
          git -C tools/drat-trim rev-parse HEAD | tee drat-trim.commit

      - name: Generate distributed canonical shards
        shell: bash
        run: |
          set -euo pipefail
          ROOT="results/higher-order-q-first/${ORDER}"
          mkdir -p "${ROOT}/raw"
          : > "${ROOT}/plantri.stderr"
          for residue in 0 137 911 1597 2718 4093 5003 6121 7351 8123 9001 9733; do
            echo "Generating order ${ORDER}, shard ${residue}/10000"
            timeout 240 bash -c \
              "./plantri58/plantri -bc4dg ${ORDER}d ${residue}/10000 2>>${ROOT}/plantri.stderr | head -n 400 > ${ROOT}/raw/shard_${residue}.g6" \
              || true
            wc -l "${ROOT}/raw/shard_${residue}.g6" || true
          done
          cat "${ROOT}"/raw/*.g6 | LC_ALL=C sort -u > "${ROOT}/canonical_${ORDER}.g6"
          COUNT=$(wc -l < "${ROOT}/canonical_${ORDER}.g6")
          echo "unique canonical records: ${COUNT}"
          test "${COUNT}" -gt 0

      - name: Filter and rank theorem-escaping graphs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="results/higher-order-q-first/${ORDER}"
          python search/canonical_prepare.py \
            "${ROOT}/canonical_${ORDER}.g6" \
            --order "${ORDER}" --trials 192 --top 6 --seed "$((20260801 + ORDER))" \
            --output "${ROOT}/verified_canonical_${ORDER}.json" \
            | tee "${ROOT}/ranking.log"

      - name: Q-first natural cyclic-cut screening
        shell: bash
        run: |
          set -euo pipefail
          ROOT="results/higher-order-q-first/${ORDER}"
          python search/higher_order_q_first.py \
            --verified "${ROOT}/verified_canonical_${ORDER}.json" \
            --graphs 6 --patches-per-graph 320 \
            --state-time 4 --retry-time 45 --workers 4 \
            --output "${ROOT}/q_first_results.json" \
            | tee "${ROOT}/q_first.log"

      - name: Independently verify every nonpositive Q case
        shell: bash
        run: |
          set -uo pipefail
          ROOT="results/higher-order-q-first/${ORDER}"
          mkdir -p "${ROOT}/sat-verification"
          timeout 3600 python search/sat_verify_q_candidates.py \
            --input "${ROOT}/q_first_results.json" \
            --output-dir "${ROOT}/sat-verification" \
            --solver g4 \
            --drat-trim tools/drat-trim/drat-trim \
            --max-cases 100 \
            | tee "${ROOT}/sat_verification.log"
          status=${PIPESTATUS[0]}
          if [ "${status}" -eq 124 ]; then
            echo "SAT verification reached the one-hour campaign limit; unresolved cases remain unknown."
          elif [ "${status}" -ne 0 ]; then
            echo "SAT verification failed with status ${status}; cases remain unknown."
          fi
          exit 0

      - name: Write order summary and manifest
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess
          import networkx, numpy, scipy
          try:
              import pysat
              pysat_version = pysat.__version__
          except Exception:
              pysat_version = None
          order = int(os.environ['ORDER'])
          root = pathlib.Path(f'results/higher-order-q-first/{order}')
          root.mkdir(parents=True, exist_ok=True)
          q_path = root / 'q_first_results.json'
          sat_path = root / 'sat-verification' / 'sat_q_verification_summary.json'
          q = json.loads(q_path.read_text()) if q_path.exists() else None
          sat = json.loads(sat_path.read_text()) if sat_path.exists() else None
          summary = {
              'order': order,
              'q_first': q.get('summary') if q else None,
              'sat_verification': sat.get('summary') if sat else None,
              'certified_missing_q_states': (
                  sat.get('summary', {}).get('certified_missing_q_states', 0)
                  if sat else 0
              ),
              'counterexample_found': False,
          }
          (root / 'ORDER_SUMMARY.json').write_text(json.dumps(summary, indent=2))
          files=[]
          for path in sorted(root.rglob('*')):
              if path.is_file():
                  files.append({
                      'path': str(path),
                      'bytes': path.stat().st_size,
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  })
          manifest = {
              'campaign': 'higher-order-q-first',
              'order': order,
              'git_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'plantri_archive_sha256': os.environ['PLANTRI_SHA256'],
              'plantri_command': f'plantri -bc4dg {order}d RES/10000',
              'drat_trim_commit': pathlib.Path('drat-trim.commit').read_text().strip() if pathlib.Path('drat-trim.commit').exists() else None,
              'software': {
                  'python': platform.python_version(),
                  'networkx': networkx.__version__,
                  'numpy': numpy.__version__,
                  'scipy': scipy.__version__,
                  'python_sat': pysat_version,
              },
              'classification_policy': {
                  'positive': 'requires independently validated selected-edge witness',
                  'negative': 'requires SAT UNSAT proof accepted by drat-trim',
                  'timeout_or_failure': 'unknown',
              },
              'files': files,
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload higher-order evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barnette-q-first-order-${{ matrix.order }}-${{ github.sha }}
          path: |
            results/higher-order-q-first/${{ matrix.order }}
            plantri58.tar.gz
            drat-trim.commit
          if-no-files-found: warn
          retention-days: 30
