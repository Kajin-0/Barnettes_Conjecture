name: Three-edge facial obstruction proof

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/face-three-edge-proof.yml
      - search/sat_verify_face_constraints.py
      - results/2026-08-02/three_edge_face_candidates.json
      - requirements.txt

permissions:
  contents: read

concurrency:
  group: face-three-edge-proof
  cancel-in-progress: true

jobs:
  verify:
    name: CaDiCaL and DRAT verification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python - <<'PY'
          import networkx, pysat
          from pysat.solvers import Solver
          print('networkx', networkx.__version__)
          print('python-sat', pysat.__version__)
          with Solver(name='g4') as solver:
              solver.add_clause([1])
              assert solver.solve()
          PY

      - name: Build independent proof toolchain
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/marijnheule/drat-trim.git tools/drat-trim
          make -C tools/drat-trim
          test -x tools/drat-trim/drat-trim
          git -C tools/drat-trim rev-parse HEAD | tee drat-trim.commit

          git clone --depth 1 https://github.com/arminbiere/cadical.git tools/cadical
          cd tools/cadical
          ./configure
          make -j2
          test -x build/cadical
          build/cadical --version
          git rev-parse HEAD | tee ../../cadical.commit

      - name: Verify all facial constraint cases
        shell: bash
        run: |
          set -euo pipefail
          ROOT="results/2026-08-02/three-edge-proof"
          mkdir -p "${ROOT}"
          python search/sat_verify_face_constraints.py \
            --input results/2026-08-02/three_edge_face_candidates.json \
            --output-dir "${ROOT}" \
            --solver g4 \
            --proof-solver tools/cadical/build/cadical \
            --drat-trim tools/drat-trim/drat-trim \
            --max-rounds 10000 \
            --proof-timeout 1200 \
            --max-cases 100 \
            | tee "${ROOT}/verification.log"

      - name: Write proof manifest
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, platform, subprocess
          import networkx
          try:
              import pysat
              pysat_version=pysat.__version__
          except Exception:
              pysat_version=None
          root=pathlib.Path('results/2026-08-02/three-edge-proof')
          root.mkdir(parents=True,exist_ok=True)
          summary_path=root/'face_constraint_verification_summary.json'
          summary=json.loads(summary_path.read_text()) if summary_path.exists() else None
          files=[]
          for path in sorted(root.rglob('*')):
              if path.is_file():
                  files.append({
                      'path':str(path),
                      'bytes':path.stat().st_size,
                      'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),
                  })
          manifest={
              'campaign':'three-edge-facial-obstruction-proof',
              'git_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'candidate_file':'results/2026-08-02/three_edge_face_candidates.json',
              'summary':summary.get('summary') if summary else None,
              'drat_trim_commit':pathlib.Path('drat-trim.commit').read_text().strip() if pathlib.Path('drat-trim.commit').exists() else None,
              'cadical_commit':pathlib.Path('cadical.commit').read_text().strip() if pathlib.Path('cadical.commit').exists() else None,
              'software':{
                  'python':platform.python_version(),
                  'networkx':networkx.__version__,
                  'python_sat':pysat_version,
              },
              'classification_policy':{
                  'positive':'independently validated Hamiltonian-cycle edge witness',
                  'negative':'CaDiCaL final-CNF UNSAT proof accepted by drat-trim',
                  'timeout_or_failure':'unknown or provisional',
              },
              'files':files,
          }
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest['summary'],indent=2))
          PY

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-edge-facial-proof-${{ github.sha }}
          path: |
            results/2026-08-02/three-edge-proof
            results/2026-08-02/three_edge_face_candidates.json
            search/sat_verify_face_constraints.py
            drat-trim.commit
            cadical.commit
          if-no-files-found: error
          retention-days: 90
